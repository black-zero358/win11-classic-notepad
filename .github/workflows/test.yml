name: PowerShell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell7:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test PowerShell 7 without system changes
        shell: pwsh
        run: ./tests/Run-Tests.ps1

  powershell51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows PowerShell 5.1 without system changes
        shell: powershell
        run: ./tests/Run-Tests.ps1
